const $ = id => document.getElementById(id);
const show = id => { ['expired','intro','quiz','result'].forEach(s => $(s).classList.add('hidden')); $(id).classList.remove('hidden'); };

let scores = {};
let idx = 0;

function computeAppearances() {
  const ap = {};
  QUESTIONS.forEach(q => { ap[q.a] = (ap[q.a] || 0) + 1; });
  return ap;
}
const APPEARANCES = computeAppearances();

function isExpired() { return Date.now() >= DEADLINE.getTime(); }

function updateCountdown() {
  const left = DEADLINE.getTime() - Date.now();
  if (left <= 0) { show('expired'); return; }
  const h = Math.floor(left / 3600000);
  const m = Math.floor((left % 3600000) / 60000);
  const dh = DEADLINE.getHours();
  const dm = ('0' + DEADLINE.getMinutes()).slice(-2);
  const remain = h > 0 ? (h + ' 小时 ' + m + ' 分') : (m + ' 分钟');
  $('deadlineText').textContent = '今天 ' + dh + ':' + dm + ' 过期 · 还剩 ' + remain;
}

function start() {
  scores = {};
  idx = 0;
  renderQuestion();
  show('quiz');
}

function renderQuestion() {
  const q = QUESTIONS[idx];
  $('progressText').textContent = '第 ' + (idx + 1) + ' / ' + QUESTIONS.length + ' 题';
  $('progressFill').style.width = (idx / QUESTIONS.length * 100) + '%';
  $('qText').textContent = q.q;
  $('options').innerHTML = '';

  SCALE.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = opt.t;
    b.onclick = () => choose(q.a, opt.score);
    $('options').appendChild(b);
  });
}

function choose(a, score) {
  scores[a] = (scores[a] || 0) + score;
  next();
}

function next() {
  idx++;
  if (idx < QUESTIONS.length) { renderQuestion(); }
  else { finish(); }
}

function finish() {
  const ranked = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const top = ranked[0];
  const r = RESULTS[top[0]];
  const conc = Math.round((top[1] / (APPEARANCES[top[0]] * 4)) * 100);

  $('rImg').src = top[0] + '.png';
  $('rName').textContent = top[0];
  $('rConc').textContent = '浓度 ' + conc + '%';
  $('rTags').innerHTML = r.tags.map(t => '<span class="tag">' + t + '</span>').join('');
  $('rDesc').textContent = r.desc;
  $('rQuote').textContent = '「' + r.quote + '」';

  const d = DETAIL[top[0]];
  if (d) {
    $('aPortrait').textContent = d.portrait;
    $('aStrengths').innerHTML = d.strengths.map(s => '<li>' + s + '</li>').join('');
    $('aWeaknesses').innerHTML = d.weaknesses.map(w => '<li>' + w + '</li>').join('');
    $('aLove').textContent = d.love;
    $('aAdvice').textContent = d.advice;
  }
  show('result');
}

function shade(hex) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.max(0, r - 45); g = Math.max(0, g - 45); b = Math.max(0, b - 45);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

$('startBtn').onclick = start;

if (isExpired()) { show('expired'); }
else { updateCountdown(); setInterval(updateCountdown, 30000); show('intro'); }
</script>
